<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subtitle Translator</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #f5f5f5;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 15px;
      font-weight: 600;
      color: #ffdd57;
    }
    .row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    label {
      font-size: 12px;
      color: #aaa;
    }
    select {
      background: #2a2a2a;
      color: #f5f5f5;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .vocab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      background: #ffdd57;
      color: #1a1a1a;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 12px;
    }
    .vocab-btn:hover { background: #ffe580; }
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      line-height: 1.4;
    }
    .word-count {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-top: -4px;
      margin-bottom: 12px;
    }
    details.advanced {
      margin: 8px 0 14px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
    }
    details.advanced summary {
      font-size: 12px;
      color: #888;
      cursor: pointer;
      list-style: none;
      padding: 4px 0;
      user-select: none;
    }
    details.advanced summary::before {
      content: '▸ ';
      font-size: 9px;
      transition: transform 0.15s ease;
      display: inline-block;
    }
    details.advanced[open] summary::before {
      transform: rotate(90deg);
    }
    details.advanced:hover summary { color: #ccc; }
    .advanced-body { padding: 8px 0 4px 0; }
    .advanced-body p {
      font-size: 11px;
      color: #888;
      margin: 0 0 8px 0;
      line-height: 1.4;
    }
    .advanced-body input {
      width: 100%;
      background: #2a2a2a;
      color: #f5f5f5;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      box-sizing: border-box;
    }
    .advanced-body input:focus {
      outline: none;
      border-color: #ffdd57;
    }
    .key-status {
      font-size: 11px;
      margin-top: 6px;
      min-height: 14px;
    }
    .key-status.ok { color: #6ee08a; }
    .key-status.err { color: #ff8a8a; }
    .hint-link {
      margin-top: 6px !important;
    }
    .hint-link a {
      color: #ffdd57;
      text-decoration: none;
    }
    .hint-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Subtitle Translator</h1>

  <button id="open-vocab" class="vocab-btn">
    📖 My vocabulary
  </button>
  <div class="word-count" id="word-count"></div>

  <div class="row">
    <label for="lang">Translate to</label>
    <select id="lang">
      <option value="ru">Russian</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="it">Italian</option>
      <option value="pt">Portuguese</option>
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="uk">Ukrainian</option>
      <option value="pl">Polish</option>
      <option value="tr">Turkish</option>
      <option value="ar">Arabic</option>
    </select>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="pause" />
    <label for="pause">Pause video on click</label>
  </div>

  <details class="advanced">
    <summary>Advanced: DeepL API key</summary>
    <div class="advanced-body">
      <p>DeepL usually gives better translations for phrases and idioms. Free
      tier: 500k characters/month.</p>
      <input id="deepl-key" type="password" placeholder="Paste DeepL API key here" />
      <div class="key-status" id="key-status"></div>
      <p class="hint-link">
        <a href="https://www.deepl.com/pro-api" target="_blank">Get a free key →</a>
      </p>
    </div>
  </details>

  <div class="hint">
    Turn on English subtitles on inoriginal.cc, then click any word.
  </div>

  <script src="popup.js"></script>
</body>
</html>
