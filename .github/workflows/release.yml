name: Release

# Triggered by pushing a tag like v1.6.0 (created by `npm version`).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Also verifies that the tag matches package.json / manifest.json.
      - run: npm run build

      # Idempotent, so a failed run (e.g. the Web Store step) can be re-run.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Check Chrome Web Store secrets
        id: cws
        run: |
          missing=""
          for name in EXTENSION_ID PUBLISHER_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            [ -n "${!name}" ] || missing="$missing CWS_$name"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$missing" = " CWS_EXTENSION_ID CWS_PUBLISHER_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN" ]; then
            echo "::warning::CWS_* secrets are not set — skipped Chrome Web Store publish. See README."
          else
            echo "::error::Some Chrome Web Store secrets are missing:$missing"
            exit 1
          fi

      - name: Publish to Chrome Web Store
        if: steps.cws.outputs.ready == 'true'
        run: npx chrome-webstore-upload --source dist/*.zip
